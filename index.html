<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三维 Lenia 培养皿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: full-bleed volume render; a field-guide panel docked left: species list, notes, controls, census. Single dark look by design. */
:root {
  --bg: #07090a;
  --fg: #e6ebe6;
  --muted: #86918c;
  --chip: rgba(10, 13, 13, 0.78);
  --line: rgba(230, 235, 230, 0.13);
  --grow: #f2b870;
  --decay: #6fd1c4;
  --font: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas:active { cursor: grabbing; }
#ov { pointer-events: none; cursor: default; }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.panel {
  position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(16px + env(safe-area-inset-top, 0px));
  width: min(320px, calc(100% - 32px)); max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow: auto;
  display: grid; gap: 12px; padding: 16px;
  background: var(--chip); border: 1px solid var(--line); border-radius: 10px;
  backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px); font-size: 12.5px;
}
.panel h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: 0.03em; }
.panel h1 small { font-family: var(--mono); font-size: 10.5px; font-weight: 400; color: var(--muted); margin-left: 6px; }
.panel p { margin: 0; color: var(--muted); line-height: 1.6; }
.legend { display: flex; gap: 14px; color: var(--muted); font-size: 11.5px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.species { display: grid; gap: 4px; }
.species button { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 8px; text-align: left; padding: 7px 9px; }
.species button span { font-weight: 600; }
.species button em { font-style: italic; font-size: 10.5px; color: var(--muted); font-family: Georgia, "Times New Roman", serif; }
button {
  font: 500 12.5px var(--font); color: var(--fg); background: transparent; border: 1px solid var(--line);
  border-radius: 7px; padding: 8px 6px; cursor: pointer; transition: background .15s, border-color .15s; text-align: center;
}
button:hover { background: rgba(230, 235, 230, 0.07); border-color: rgba(230, 235, 230, 0.3); }
button[aria-pressed="true"] { border-color: var(--grow); }
button[aria-pressed="true"] span { color: var(--grow); }
button.primary { background: var(--grow); border-color: var(--grow); color: #1c1208; }
button.primary:hover { background: #f7c98c; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--grow); outline-offset: 2px; }
.card { border-left: 2px solid var(--grow); padding: 2px 0 2px 10px; display: grid; gap: 4px; }
.card .meta { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.card .what { color: var(--fg); line-height: 1.55; }
.grp { display: grid; gap: 6px; }
.cap { font-size: 10.5px; color: var(--muted); letter-spacing: 0.06em; }
.seg4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg4 button { display: grid; gap: 1px; padding: 7px 2px; }
.seg4 small { font-size: 10px; color: var(--muted); font-family: var(--mono); }
.seg4 button:disabled { opacity: 0.35; cursor: not-allowed; }
.row { display: grid; grid-template-columns: 22px 1fr 58px; align-items: center; gap: 10px; }
.row span { font-family: var(--mono); color: var(--fg); }
.row output { font-family: var(--mono); text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; min-width: 0; accent-color: var(--grow); margin: 0; }
.btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.readout { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.readout div { display: grid; gap: 2px; min-width: 0; }
.readout label { font-size: 10.5px; color: var(--muted); }
.readout output { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hint { color: var(--grow); font-size: 11.5px; }
.credit { font-size: 11px; }
.err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
@media (max-width: 560px) { .panel { padding: 12px; gap: 9px; } .hide-sm { display: none; } }
</style>

<canvas id="c" aria-label="三维 Lenia 连续元胞自动机的体积渲染"></canvas>
<canvas id="ov" aria-hidden="true"></canvas>
<section class="panel" aria-label="培养皿控制">
  <h1>三维 Lenia<small id="sub">128³ · FFT 卷积</small></h1>
  <div class="legend"><span><i style="background:var(--grow)"></i>正在生长</span><span><i style="background:var(--decay)"></i>正在消亡</span></div>
  <div class="species" id="species" role="group" aria-label="物种"></div>
  <div class="card"><div class="meta" id="meta"></div><div class="what" id="what"></div></div>
  <div class="grp"><span class="cap">数量</span>
    <div class="seg2" role="group" aria-label="数量">
      <button type="button" data-count="multi" aria-pressed="true"><span>多只</span></button>
      <button type="button" data-count="single" aria-pressed="false"><span>单只</span></button>
    </div></div>
  <div class="grp"><span class="cap">分辨率</span>
    <div class="seg4" role="group" aria-label="分辨率">
      <button type="button" data-res="64" aria-pressed="false"><span>64³</span><small>流畅</small></button>
      <button type="button" data-res="128" aria-pressed="true"><span>128³</span><small>默认</small></button>
      <button type="button" data-res="256" aria-pressed="false"><span>256³</span><small>~1GB</small></button>
      <button type="button" data-res="512" aria-pressed="false"><span>512³</span><small>~7GB</small></button>
    </div></div>
  <label class="row" for="rOp"><span>◐</span><input id="rOp" type="range" min="1" max="30" step="0.5" value="4.5"><output id="vOp">4.5</output></label>
  <label class="row" for="rLight"><span>☀</span><input id="rLight" type="range" min="0" max="3" step="0.05" value="1"><output id="vLight">1.00</output></label>
  <label class="row" for="rSpd"><span>⏵</span><input id="rSpd" type="range" min="0" max="8" step="1" value="2"><output id="vSpd">2 步/帧</output></label>
  <label class="row" for="rMu"><span>μ</span><input id="rMu" type="range" step="0.0005"><output id="vMu"></output></label>
  <label class="row" for="rSg"><span>σ</span><input id="rSg" type="range" step="0.0002"><output id="vSg"></output></label>
  <label class="row" for="rCut"><span>✂</span><input id="rCut" type="range" min="-0.9" max="1" step="0.01" value="1"><output id="vCut">不切</output></label>
  <div class="seg2" role="group" aria-label="显示">
    <button id="bTrail" type="button" aria-pressed="true"><span>烟雾拖尾</span></button>
    <button id="bVec" type="button" aria-pressed="false"><span>方向矢量</span></button>
  </div>
  <div class="btns">
    <button id="bSeed" class="primary" type="button">重新放入</button>
    <button id="bFollow" type="button" aria-pressed="true"><span>跟随</span></button>
    <button id="bPause" type="button" aria-pressed="false"><span>暂停</span></button>
  </div>
  <div class="readout">
    <div><label>个体</label><output id="oBlobs">–</output></div>
    <div><label>质量</label><output id="oMass">–</output></div>
    <div><label>步数 · 步/秒</label><output id="oStep">0</output></div>
    <div><label>帧率</label><output id="oFps">–</output></div>
  </div>
  <p id="hint" hidden></p>
  <p class="hide-sm">☀ 是光照强度，◐ 是不透明度（越往左越通透）。“多只”会一次放进好几只、朝向随机；“单只”只放一只并拉近镜头。分辨率越高越精细也越吃显卡，模拟会按显卡能承受的速度自动放慢，画面保持流畅。世界是首尾相连的：生物从一面出去会从对面进来，“跟随”会把一只生物一直保持在画面中央。拖动旋转，滚轮缩放，点击空白处再放一只。</p>
  <p class="credit">物种数据来自 Bert Chan 的 Lenia 项目（<a href="https://github.com/Chakazul/Lenia" style="color:var(--muted)">github.com/Chakazul/Lenia</a>）。</p>
</section>
